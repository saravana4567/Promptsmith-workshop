<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="800" height="900" fill="#f7f9fc"/>
<text x="400" y="55" text-anchor="middle" font-size="30" font-weight="bold" fill="#1b2a4a">Anatomy of a Great Prompt</text>
<text x="400" y="85" text-anchor="middle" font-size="15" fill="#4a5a78">Prompt Engineering Workshop | 1st/2nd-year CSE | by M. Saravanan</text>
<g font-size="15">
<rect x="60" y="110" width="680" height="75" rx="12" fill="#4f7cff"/><text x="85" y="140" fill="#fff" font-weight="bold" font-size="18">1. ROLE</text><text x="85" y="166" fill="#fff">Who should the AI be? "You are a patient Python tutor."</text>
<rect x="60" y="200" width="680" height="75" rx="12" fill="#22a699"/><text x="85" y="230" fill="#fff" font-weight="bold" font-size="18">2. TASK</text><text x="85" y="256" fill="#fff">One clear action: "Find and explain the bug."</text>
<rect x="60" y="290" width="680" height="75" rx="12" fill="#f59e0b"/><text x="85" y="320" fill="#fff" font-weight="bold" font-size="18">3. CONTEXT + INPUT</text><text x="85" y="346" fill="#fff">Language, level, goal + the exact code/text (no private data).</text>
<rect x="60" y="380" width="680" height="75" rx="12" fill="#e4572e"/><text x="85" y="410" fill="#fff" font-weight="bold" font-size="18">4. FORMAT</text><text x="85" y="436" fill="#fff">Shape the answer: table, 3 bullets, JSON, under 100 words.</text>
<rect x="60" y="470" width="680" height="75" rx="12" fill="#8e5bd6"/><text x="85" y="500" fill="#fff" font-weight="bold" font-size="18">5. EXAMPLES (few-shot)</text><text x="85" y="526" fill="#fff">Show 1-3 input -> output pairs to lock style and format.</text>
<rect x="60" y="560" width="680" height="75" rx="12" fill="#2f3e5c"/><text x="85" y="590" fill="#fff" font-weight="bold" font-size="18">6. CONSTRAINTS + REASONING</text><text x="85" y="616" fill="#fff">What to avoid; "think step by step"; ReAct: reason, look up, observe.</text>
<rect x="60" y="650" width="680" height="75" rx="12" fill="#c0392b"/><text x="85" y="680" fill="#fff" font-weight="bold" font-size="18">7. VERIFY (you!)</text><text x="85" y="706" fill="#fff">Run it, look it up, check dates, cross-check, credit sources.</text>
</g>
<rect x="60" y="750" width="680" height="110" rx="12" fill="#fff" stroke="#1b2a4a" stroke-width="2"/>
<text x="80" y="780" font-size="15" font-weight="bold" fill="#1b2a4a">Ethics rules</text>
<text x="80" y="805" font-size="14" fill="#1b2a4a">- Never paste passwords, IDs, API keys, personal or confidential data</text>
<text x="80" y="827" font-size="14" fill="#1b2a4a">- Verify before you trust: AI can be confidently wrong</text>
<text x="80" y="849" font-size="14" fill="#1b2a4a">- Credit sources and disclose AI help</text>
</svg>
